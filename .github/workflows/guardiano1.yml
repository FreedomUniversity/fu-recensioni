name: Recensioni guardiano 1
# Sorveglia tick + Make A/B + guardiano 2. Auto-ripara (risveglia) e avvisa.
on:
  schedule:
    - cron: '7,37 * * * *'
  # 30/10/2026 — era 'guard', e 'guard' lo ascoltavano TUTTI E DUE i guardiani: un solo
  # risveglio ne lanciava 2, ognuno ne lanciava altri 2 → 33.188 run e 551 mail "Run failed"
  # in mezz'ora. Ora ogni gemello ha il SUO evento e può risvegliare solo l'altro.
  repository_dispatch:
    types: [guard1]
  workflow_dispatch: {}
# Cintura strutturale: anche se la logica tornasse a sbagliare, GitHub tiene al massimo
# 1 run in corso + 1 in attesa per gruppo e scarta il resto. La valanga non può ripartire.
concurrency:
  group: recensioni-guardiano-1
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: guardiano 1
        env:
          SLACK_FU_TOKEN: ${{ secrets.SLACK_FU_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MAKE_TOKEN: ${{ secrets.MAKE_TOKEN }}
        run: python3 recensioni_guardiano.py 1
