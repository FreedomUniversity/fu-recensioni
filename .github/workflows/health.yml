name: Recensioni health
# Digest ON-DEMAND (bottone "Run workflow"). Il digest AUTOMATICO giornaliero ora lo fa
# il tick (recensioni_health.py --auto), che è affidabile (trigger Make ridondante) e
# committa il marker giornaliero → un solo digest al giorno, niente dipendenza dal cron.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkout stato (repo privato)
        uses: actions/checkout@v4
        with:
          repository: FreedomUniversity/fu-recensioni-state
          token: ${{ secrets.GH_PAT }}
          path: _state
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: health-check
        env:
          REC_STATE: ${{ github.workspace }}/_state/state
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SLACK_FU_TOKEN: ${{ secrets.SLACK_FU_TOKEN }}
          KLAVIYO_TOKEN: ${{ secrets.KLAVIYO_TOKEN }}
          PIPEDRIVE_TOKEN: ${{ secrets.PIPEDRIVE_TOKEN }}
        run: python3 recensioni_health.py
